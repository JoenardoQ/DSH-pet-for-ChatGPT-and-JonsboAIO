<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>桌宠放映室 · JONSBO</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#e7e9f5;background:#101119}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 5%,#30274280,transparent 55%);min-height:100vh}main{max-width:1040px;margin:auto;padding:44px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:28px}h1{font-size:28px;letter-spacing:.03em;margin:6px 0}h2{font-size:16px;margin:0 0 16px}p{line-height:1.65}small,.muted{color:#9da1b6;font-size:13px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#b8a3ed}.badge{border:1px solid #41404f;border-radius:30px;padding:8px 14px;font-size:13px;white-space:nowrap}.badge.good{color:#8fe0bd;border-color:#386d59}.layout{display:grid;grid-template-columns:1.05fr 1fr;gap:22px}.panel{border:1px solid #2e2f3e;border-radius:22px;background:#1b1c27;padding:24px}.preview{background:#111722;position:relative;overflow:hidden;padding:0;aspect-ratio:1}.preview img{width:100%;height:100%;object-fit:contain;display:block}.empty{height:100%;display:grid;place-content:center;text-align:center;padding:30px;color:#9da1b6}.stack{display:grid;gap:18px}.sources{display:grid;grid-template-columns:1fr 1fr;gap:10px}button,select{font:inherit;font-size:14px;border:1px solid #444353;border-radius:12px;background:#282936;color:#eee;cursor:pointer;padding:12px 16px;transition:background .15s,border-color .15s}button:hover:enabled{background:#373447;border-color:#ad91df}button:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #c6a7ff;outline-offset:3px}button:disabled{opacity:.4;cursor:not-allowed}.source{text-align:left;padding:14px}.source strong{display:block;font-size:15px;margin-bottom:6px}.source span{color:#aaaabe;font-size:12px}.source[aria-pressed=true]{background:#342b48;border-color:#b292e4}.primary{background:#bca0e8;color:#191222;border-color:#bca0e8;font-weight:600}.primary:hover:enabled{background:#d1b9f5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions button{flex:1}.takeover{width:100%;margin-top:10px;background:#493b2a;border-color:#896b43;color:#ffdc9b}.notice{font-size:13px;color:#bbb9cd;margin:14px 0 0;min-height:42px}select{width:100%}#result{margin:18px 0 0;min-height:24px;font-size:14px;color:#cfb7f4}details{margin-top:22px;color:#989bb0;font-size:12px}summary{cursor:pointer;padding:10px 0}pre{max-height:220px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;background:#14151e;border-radius:12px;padding:16px}footer{margin-top:20px;color:#777c93;font-size:12px}[hidden]{display:none!important}@media(max-width:730px){main{padding:24px 16px}.layout{grid-template-columns:1fr}.preview{max-height:420px}header{align-items:flex-start}h1{font-size:23px}}
.backgrounds{display:grid;grid-template-columns:1fr 1fr;gap:10px}.backgrounds button{padding:8px;text-align:left;font-size:12px}.backgrounds img{width:100%;height:78px;object-fit:cover;border-radius:7px;display:block;margin-bottom:7px}.backgrounds [aria-pressed=true]{border-color:#c6a7ff;background:#342b48}.backgrounds button:first-child{grid-column:1/-1}
</style>
<main>
<header><div><div class="eyebrow">PET TRIO / SCREEN ROOM</div><h1>桌宠放映室</h1><small>选好陪伴你的她，剩下的交给屏幕。</small></div><small id="build"></small><span id="badge" class="badge" role="status">检查连接中</span></header>
<div class="layout">
<section class="panel preview" aria-label="投屏预览"><img id="frame" hidden alt="当前投屏的完整画面"><div id="empty" class="empty">等待桌宠画面<br><small>在 DSH 或 ChatGPT / Codex 中开启桌宠</small></div></section>
<div class="stack">
<section class="panel"><h2>谁来上屏</h2><div class="sources"><button class="source" data-source="dsh" aria-pressed="false"><strong id="dsh-name">DSH 桌宠</strong><span id="dsh-state">检查中</span></button><button class="source" data-source="chatgpt" aria-pressed="false"><strong id="chatgpt-name">GPT 桌宠</strong><span id="chatgpt-state">检查中</span></button></div><p class="notice" id="selection">先开启桌宠，再选择画面。</p><div class="actions"><button id="connect" class="primary">连接屏幕</button><button id="disconnect">断开投屏</button></div><button id="takeover" class="takeover" hidden>接管屏幕 · 退出官方程序</button><p class="notice" id="connection">正在检查乔思伯屏幕…</p></section>
<section class="panel"><h2>屏幕背景</h2><div id="backgrounds" class="backgrounds" aria-label="选择屏幕背景"></div><p class="muted" id="background-status"></p></section>
<section class="panel"><h2>一起玩一会</h2><select id="duet" aria-label="双人互动"><option value="auto">自动轮换 · 8 种互动</option><option value="off">关闭互动 · 各自陪伴</option><option value="boxing">拳击</option><option value="volleyball">排球</option><option value="running">赛跑</option><option value="shopping">逛街</option><option value="sunset">看日落</option><option value="gardening">浇花</option><option value="gaming">格斗游戏比赛</option><option value="cafe">咖啡厅看书</option></select><p id="participants" class="muted"></p><p id="duet-status" class="notice">检查双方连接中…</p></section>
</div></div>
<p id="result" role="status" aria-live="polite"></p>
<details><summary>连接详情与诊断</summary><pre id="status"></pre></details>
<footer>首个在线桌宠保留投屏，另一位等待；点击角色卡即可切换。桌宠动作与显隐在各自右键菜单中管理。</footer>
</main>
<script>
const $=id=>document.getElementById(id), roles={fish:'大肥鱼',whale:'鲸鱼娘',chatgpt:'ChatGPT 娘'};
let state=null, source=null, busy=false;
const scenes=Object.fromEntries([...$('duet').options].map(o=>[o.value,o.textContent]));
async function post(route,body){const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json','X-Pet-Client':'1'},body:JSON.stringify(body)});const v=await r.json();if(!r.ok)throw Error(v.error||'操作失败，请重试');return v;}
function render(s){
 state=s;const active=s.activeSources||[],connected=s.connectedSources||active;source=s.screenSource||s.selectedSource||connected[0]||null;
 $('build').textContent='v'+s.build;
 if(!$('backgrounds').children.length)for(const bg of s.backgrounds||[]){
   const button=document.createElement('button');button.dataset.background=bg.id;
   if(bg.id!=='none'){const img=document.createElement('img');img.src='/backgrounds/'+bg.id+'.png';img.alt='';button.append(img);}
   button.append(document.createTextNode(bg.label));button.onclick=()=>act(async()=>{await post('/appearance',{background:bg.id});$('result').textContent='已选择'+bg.label+'。';});$('backgrounds').append(button);
 }
 document.querySelectorAll('[data-background]').forEach(b=>{b.disabled=busy;b.setAttribute('aria-pressed',String(b.dataset.background===s.appearance?.background));});
 $('background-status').textContent='背景随完整画面顺时针旋转 90°，选择会自动保存。';
 for(const key of ['dsh','chatgpt']){const live=active.includes(key),selected=source===key;const b=document.querySelector('[data-source="'+key+'"]');b.disabled=busy||!live;b.setAttribute('aria-pressed',String(selected));$(key+'-name').textContent=roles[s.characters?.[key]]||(key==='dsh'?'DSH 桌宠':'GPT 桌宠');$(key+'-state').textContent=!connected.includes(key)?'插件未连接':!live?'已连接 · 等待画面':selected?'当前画面':'已在线 · 点击切换';}
 const live=source&&active.includes(source),available=source&&connected.includes(source),enabled=available&&s.screens[source]!==false,usb=s.output.usb;
 $('selection').textContent=live?$(''+source+'-name').textContent+(enabled?'已选中。其他在线桌宠会等待手动切换。':'已选中，投屏已断开。'):'请先在对应宿主中开启桌宠；此页面不会额外创建另一只。';
 $('connect').disabled=busy||!available||(enabled&&usb==='streaming');$('disconnect').disabled=busy||!enabled;
 $('takeover').hidden=!enabled||!['busy','permission-required'].includes(usb);$('takeover').disabled=busy;
 $('takeover').textContent=usb==='permission-required'?'以管理员权限接管屏幕':'接管屏幕 · 退出官方程序';
 const labels={'requesting-permission':'等待 Windows 权限确认',streaming:'正在投屏','waiting-device':'等待 USB 屏幕',busy:'官方程序占用','permission-required':'需要接管权限','missing-sdk':'缺少官方 SDK','multiple-devices':'请选择屏幕',inactive:'未投屏',disabled:'未投屏','waiting-screen':'其他程序正在投屏',error:'连接异常'};
 $('badge').textContent=!enabled?'未投屏':labels[usb]||'正在连接';$('badge').classList.toggle('good',enabled&&usb==='streaming');
 $('connection').textContent=!enabled?'连接后会投出左侧完整画面，包含台词和插图。':usb==='streaming'?'乔思伯正在显示所选画面。':s.output.error||labels[usb]||'正在准备输出，请稍候…';
 if(document.activeElement!==$('duet'))$('duet').value=s.duet?.mode||'auto';
 $('duet').disabled=busy;
 $('duet-status').textContent=s.duet?.active?'正在一起'+scenes[s.duet.action]+'。':s.duet?.mode==='off'?'互动已关闭，双方各自陪伴。':s.duet?.reason||'等待双方画面同步。';
 const members=s.duet?.participants;
 $('participants').textContent=members?['dsh','chatgpt'].map(k=>(k==='dsh'?'DSH':'GPT')+'：'+(members[k]?roles[members[k].character]+(members[k].build?' v'+members[k].build:''):'未连接')).join('　/　'):'';
 $('status').textContent=JSON.stringify(s,null,2);$('frame').hidden=!live;$('empty').hidden=!!live;
 if(!live)$('empty').textContent=available?'桌宠已连接，等待动画画面。':'请在 DSH 或 GPT 宿主中开启桌面桌宠。';
}
async function refresh(){try{const r=await fetch('/state');if(!r.ok)throw Error();render(await r.json());}catch{$('badge').textContent='服务未连接';$('connection').textContent='请在宿主中重新启用桌宠，页面会自动重连。';document.querySelectorAll('button,select').forEach(b=>b.disabled=true);} }
async function act(task){if(busy)return;busy=true;if(state)render(state);try{await task();}catch(e){$('result').textContent=e.message;}finally{busy=false;await refresh();}}
document.querySelectorAll('[data-source]').forEach(b=>b.onclick=()=>act(async()=>{const s=await post('/device/source',{source:b.dataset.source});render(s);$('result').textContent='已选择'+$(b.dataset.source+'-name').textContent+'。';}));
$('connect').onclick=()=>act(async()=>{await post('/device/connection',{source,enabled:true});$('result').textContent='正在连接；连接成功后右上角会显示“正在投屏”。';});
$('disconnect').onclick=()=>act(async()=>{await post('/device/connection',{source,enabled:false});$('result').textContent='已断开所选桌宠投屏；其他在线来源仍可接替。';});
$('takeover').onclick=()=>act(async()=>{const r=await post('/device/takeover',{});await post('/device/connection',{source,enabled:true});$('result').textContent=r.message;});
$('duet').onchange=()=>{const mode=$('duet').value;return act(async()=>{await post('/duet',{mode});$('result').textContent=mode==='off'?'已关闭双人互动。':'已保存互动选择；双方画面就绪后开始。';});};
(async function preview(){if(!document.hidden&&state?.activeSources?.includes(source)){const wanted=source,img=new Image();await new Promise(resolve=>{img.onload=()=>{if(source===wanted)$('frame').src=img.src;resolve();};img.onerror=resolve;img.src='/frame.png?source='+wanted+'&t='+Date.now();});}setTimeout(preview,85);})();
(async function poll(){await refresh();setTimeout(poll,1000);})();
</script>
</html>
