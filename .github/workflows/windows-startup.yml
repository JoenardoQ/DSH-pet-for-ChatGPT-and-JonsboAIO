name: Windows startup and lite package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DESKTOP_PET_HEADLESS: '1'
      DESKTOP_PET_RUN_COLD_TEST: '1'
      PET_SKIP_RUNTIME_SETUP: '1'
      DSH_PET_USE_WINDOWS_BOOTSTRAP: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache@v4
        with:
          path: .qa/launcher-smoke
          key: windows-runtime-${{ hashFiles('scripts/windows-launcher.json', 'scripts/runtime-lock.json') }}
      - run: npm install --omit=dev --omit=peer --ignore-scripts --package-lock=false --no-audit --no-fund
      - run: python -m pip install -r dsh-pet/desktop/requirements.txt
      - run: node --test dsh-pet/test-jonsbo/*.test.mjs test/*.test.mjs
      - run: python -m unittest discover -s dsh-pet/test-jonsbo -p 'test_*.py'
      - run: node scripts/build-windows-lite.mjs
      - run: node scripts/test-windows-package.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-startup-diagnostics
          path: .qa/package-smoke-failure.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-lite
          path: |
            dist/dsh-pet-windows-x64-lite.zip
            dist/dsh-pet-windows-x64-lite.zip.sha256
            dist/dsh-pet-windows-x64-lite.zip.files.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-lite
          path: dist
      - name: Publish verified lite package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath dist -File | Select-Object -ExpandProperty FullName
          gh release view $env:GITHUB_REF_NAME --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME @files --clobber --repo $env:GH_REPO
          } else {
            gh release create $env:GITHUB_REF_NAME @files --generate-notes --repo $env:GH_REPO
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
